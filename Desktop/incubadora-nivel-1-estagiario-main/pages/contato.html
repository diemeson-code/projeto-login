<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato | TechShop</title>

    <link rel="stylesheet" href="../css/main.css">
</head>

<body>

    <!-- Header -->
    <header class="header">

        <div class="header__container">

            <a href="index.html" class="header__logo">
                <span>TechShop</span>
            </a>

            <nav class="header__nav">

                <ul class="header__menu">

                    <li class="header__menu-item">
                        <a href="index.html" class="header__menu-link">Home</a>
                    </li>

                    <li class="header__menu-item">
                        <a href="products.html" class="header__menu-link">Produtos</a>
                    </li>

                    <li class="header__menu-item">
                        <a href="contato.html" class="header__menu-link active">Contato</a>
                    </li>

                </ul>

            </nav>

        </div>

    </header>

    <main>

        <section class="contact">

            <div class="container">

                <div class="contact__title">

                    <h1>Entre em Contato</h1>

                    <p>
                        Ficaremos felizes em responder suas dúvidas.
                    </p>

                </div>

                <div class="contact__content">

                    <div class="contact__info">

                        <h2>Informações</h2>

                        <div class="contact__item">
                            <h3>📍 Endereço</h3>
                            <p>Curitiba - PR</p>
                        </div>

                        <div class="contact__item">
                            <h3>📞 Telefone</h3>
                            <p>(41) 99999-9999</p>
                        </div>

                        <div class="contact__item">
                            <h3>📧 E-mail</h3>
                            <p>contato@techshop.com</p>
                        </div>

                    </div>

                    <form class="contact__form">

                        <input
                            type="text"
                            placeholder="Seu nome"
                            required>

                        <input
                            type="email"
                            placeholder="Seu e-mail"
                            required>

                        <input
                            type="text"
                            placeholder="Assunto"
                            required>

                        <textarea
                            rows="6"
                            placeholder="Digite sua mensagem..."
                            required>
                        </textarea>

                        <button type="submit">
                            Enviar Mensagem
                        </button>

                    </form>

                </div>

            </div>

        </section>

    </main>

    <footer class="footer">

        <div class="footer__container">

            <p>
                © 2026 TechShop. Todos os direitos reservados.
            </p>

        </div>

    </footer>

</body>
</html>
