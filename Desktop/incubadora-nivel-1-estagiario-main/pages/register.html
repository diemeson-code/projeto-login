
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - TechShop</title>

    <link rel="stylesheet" href="../css/main.css">
</head>

<body>

<header class="header">
    <div class="header__container">

        <a href="../index.html" class="header__logo">
            <span>TechShop</span>
        </a>

        <nav class="header__nav">
            <ul class="header__menu">
                <li class="header__menu-item">
                    <a href="../index.html" class="header__menu-link">Home</a>
                </li>

                <li class="header__menu-item">
                    <a href="products.html" class="header__menu-link">Produtos</a>
                </li>
            </ul>
        </nav>

    </div>
</header>

<main class="register">

    <div class="register__card">

        <h1 class="register__title">Criar Conta</h1>

        <p class="register__subtitle">
            Faça seu cadastro para comprar na TechShop.
        </p>

        <form id="formCadastro">

            <div class="form-group">
                <label for="nome">Nome Completo</label>
                <input
                    type="text"
                    id="nome"
                    placeholder="Digite seu nome completo"
                    required>
            </div>

            <div class="form-group">
                <label for="email">E-mail</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Digite seu e-mail"
                    required>
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>
                <input
                    type="password"
                    id="senha"
                    placeholder="Digite sua senha"
                    required>
            </div>

            <div class="form-group">
                <label for="confirmarSenha">Confirmar Senha</label>
                <input
                    type="password"
                    id="confirmarSenha"
                    placeholder="Confirme sua senha"
                    required>
            </div>

            <div class="form-checkbox">
                <label>
                    <input type="checkbox" required>
                    Aceito os Termos de Uso.
                </label>
            </div>

            <button type="submit" class="btn btn-primary register__button">
                Criar Conta
            </button>

        </form>

        <p id="mensagem"></p>

        <hr>

        <p class="register__login">
            Já possui uma conta?
            <a href="#">Entrar</a>
        </p>

    </div>

</main>

<footer class="footer">
    <div class="footer__container">
        <div class="footer__bottom">
            <p>&copy; 2026 TechShop - Todos os direitos reservados.</p>
        </div>
    </div>
</footer>

<script src="../js/cadastro.js"></script>

</body>
</html>
